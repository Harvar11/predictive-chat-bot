<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="60%" stop-color="#0e0720" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="twilightPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="starlightCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="paradoxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="4" />

  <!-- Celestial Coordinate Rings -->
  <circle cx="256" cy="256" r="185" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="148" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2" />

  <!-- Paradox Orbit Particles -->
  <circle cx="256" cy="71" r="7" fill="#38bdf8" filter="url(#paradoxGlow)" />
  <circle cx="256" cy="441" r="7" fill="#c084fc" filter="url(#paradoxGlow)" />
  <circle cx="71" cy="256" r="7" fill="#c084fc" filter="url(#paradoxGlow)" />
  <circle cx="441" cy="256" r="7" fill="#38bdf8" filter="url(#paradoxGlow)" />
  <circle cx="361" cy="151" r="5" fill="#ffffff" />
  <circle cx="151" cy="361" r="5" fill="#ffffff" />
  <circle cx="151" cy="151" r="5" fill="#38bdf8" />
  <circle cx="361" cy="361" r="5" fill="#c084fc" />

  <!-- Twilight Paradox Interlocking Crescents (The Mobius Knot) -->
  <g filter="url(#paradoxGlow)">
    <!-- Twilight Violet Crescent -->
    <path d="M 216 146 A 110 110 0 1 0 216 366 C 248 336 248 176 216 146 Z" fill="url(#twilightPurple)" />
    
    <!-- Starlight Cyan Crescent -->
    <path d="M 296 366 A 110 110 0 1 0 296 146 C 264 176 264 336 296 366 Z" fill="url(#starlightCyan)" opacity="0.92" />
    
    <!-- Paradox Nexus Bridge -->
    <path d="M 216 160 C 236 175 276 175 296 160 L 296 182 C 276 195 236 195 216 182 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 216 330 C 236 317 276 317 296 330 L 296 352 C 276 339 236 339 216 352 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Central Singularity / Quantum Nexus Star -->
  <g filter="url(#paradoxGlow)">
    <polygon points="256,206 276,256 256,306 236,256" fill="#ffffff" />
    <polygon points="206,256 256,242 306,256 256,270" fill="#ffffff" opacity="0.85" />
    <circle cx="256" cy="256" r="8" fill="#06b6d4" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />
  </g>
</svg>
