<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.4" />

  <!-- Neural Core -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Circuit rings -->
    <circle cx="150" cy="150" r="120" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="16 8" opacity="0.6" />
    <circle cx="150" cy="150" r="80" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8" />
    <circle cx="150" cy="150" r="40" fill="url(#glowGrad)" opacity="0.9" />

    <!-- Neural nodes and connections -->
    <circle cx="150" cy="40" r="16" fill="#8b5cf6" />
    <circle cx="150" cy="260" r="16" fill="#06b6d4" />
    <circle cx="40" cy="150" r="16" fill="#6366f1" />
    <circle cx="260" cy="150" r="16" fill="#8b5cf6" />

    <circle cx="72" cy="72" r="12" fill="#06b6d4" />
    <circle cx="228" cy="72" r="12" fill="#8b5cf6" />
    <circle cx="72" cy="228" r="12" fill="#8b5cf6" />
    <circle cx="228" cy="228" r="12" fill="#06b6d4" />

    <!-- Connector lines -->
    <line x1="150" y1="40" x2="150" y2="110" stroke="url(#glowGrad)" stroke-width="4" />
    <line x1="150" y1="190" x2="150" y2="260" stroke="url(#glowGrad)" stroke-width="4" />
    <line x1="40" y1="150" x2="110" y2="150" stroke="url(#glowGrad)" stroke-width="4" />
    <line x1="190" y1="150" x2="260" y2="150" stroke="url(#glowGrad)" stroke-width="4" />
    
    <line x1="72" y1="72" x2="120" y2="120" stroke="#06b6d4" stroke-width="3" />
    <line x1="228" y1="228" x2="180" y2="180" stroke="#06b6d4" stroke-width="3" />
    <line x1="228" y1="72" x2="180" y2="120" stroke="#8b5cf6" stroke-width="3" />
    <line x1="72" y1="228" x2="120" y2="180" stroke="#8b5cf6" stroke-width="3" />

    <!-- Center Pulse Icon -->
    <path d="M140 150 L146 142 L154 158 L160 150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
